<html lang="ja">

<body>
    <header>
        <div class="container">
            <nav class="navbar navbar-light">
                <a class="navbar-brand" href="#">
                    <img class="logo" src="images/logo.svg" alt="" height="24">

                <ul class="nav justify-content-end">
                    <li class="nav-item">

                    <li class="nav-item">

                </ul>

    <section class="top-section" id="TOP">
        <div class="top-content">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h1>ドラえもんのキャラクター紹介
                        </h1>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="content-section" id="CONTENT">
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="http://ksk.p-rim.net/higasi/images/doraemon.jpg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">のび太の孫の孫のセワシ君に頼まれてやってきたネコ型ロボット
                                        　２１１２年９月３日生まれ　大好きな食べ物はどら焼き
                                    </h5>
                                    <p class="card-text"></p>
                                    <p class="card-text"><small class="text-muted"></small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="https://www.tv-asahi.co.jp/doraemon/character/img/teacher.jpg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">のび太の担任の先生。宿題を忘れたり、遅刻してばかりののび太を、毎日のようにしかっている。</h5>
                                    <p class="card-text"></p>
                                    <p class="card-text"><small class="text-muted"></small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="https://www.tv-asahi.co.jp/doraemon/character/img/nobita.jpg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">１０才の小学生。スポーツは苦手で、勉強は好きじゃない。性格はドジでなまけもの。
                                        いじめられっ子だが、人の心の痛みがわかり、自然を大切にする、やさしいハートの持ち主。</h5>
                                    <p class="card-text"></p>
                                    <p class="card-text"><small class="text-muted"></small></p>
                                </div>
                            </div>
                        </div>
                   </div>

            </div>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./libs/bootstrap.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <title>BeEngineer 説明・体験会</title>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar navbar-light">
                <a class="navbar-brand" href="#">
                    <img class="logo" src="https://free-icons.net/wp-content/uploads/2023/04/music019.png" alt="" height="24">
                </a>
                <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <a class="nav-link" href="#TOP">TOP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#CONTENT">CONTENT</a>
                    </li>
                    <li class="nav-item">
                        <button id="alert-btn" type="button" class="btn btn-primary">ALERT</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="top-section" id="TOP">
        <div class="top-content">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h1>ヴァイオリン
                   </h1>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="content-section" id="CONTENT">
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="https://music-studio.jp/wp-content/uploads/2023/04/2023-04-18-1-e1681817605748.png" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title"> 音</h5>
                                    <p class="card-text">弦楽器の中で最も高い音を出すことができる。</p>
                                    <p class="card-text"><small class="text-muted">G2~E6</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="https://shinkyo-gakki.co.jp/lesson/wp-content/uploads/2022/01/point1_img-1-600x413.jpg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">サイズ</h5>
                                    <p class="card-text">16分の１から4分の４まで幅広いサイズがある</p>
                                    <p class="card-text"><small class="text-muted">画像参照</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="https://www.soundhouse.co.jp/images/shop/prod_img/p/pt_pvb100a.jpg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">弓</h5>
                                    <p class="card-text">ヴァイオリンの弦をこすって音を出すためのもの。</p>
                                    <p class="card-text"><small class="text-muted">➕a：松脂を塗ってしばらく弾くと音色が安定する</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12  col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="https://バイオリン上達.com/img/genmakikata0-1.jpg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title"><a href="https://store.shimamura.co.jp/ec/Facet?category_0=11190706000">弦</a></h5>
                                    <p class="card-text">ヴァイオリンの弦は、G線・D線・A線・E線の４つがある。</p>
                                    <p class="card-text"><small class="text-muted">（別名）１番線・２番線・３番線・４番線</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
               
    </section>
    <footer class="my-footer">
        <div class="container">
            <div class="row footer-row">
                <div class="col-6" style="display: flex; align-items:center; justify-content: center;">
                    <div>
                        <a href="#">
                            <img src="" alt="" height="48">
                        </a>
                    </div>
                </div>
                <div class="col-6" style="display: flex; align-items:center; justify-content: center;">
                    <u><a class="privacy-policy-link">プライバシーポリシー</a></u>
                </div>
            </div>
        </div>
    </footer>
    <!-- <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script> -->
    <script src="./libs/bootstrap.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>

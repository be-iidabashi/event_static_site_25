<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./libs/bootstrap.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <title>何をするだぁぁ！</title>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar navbar-light">
                <a class="navbar-brand" href="#">
                    <img class="logo" src="images/少年.jpeg" alt="" height="24">
                </a>
                <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <a class="nav-link" href="#TOP">TOP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#CONTENT">CONTENT</a>
                    </li>
                    <li class="nav-item">
                        <button id="alert-btn" type="button" class="btn btn-primary">ALERT</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="top-section" id="TOP">
        <div class="top-content">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h1>ジョジョの奇妙な冒険一部
                        </h1>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="content-section" id="CONTENT">
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/DIO（w）.jpg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">DIO.ブランドー</h5>
                                    <p class="card-text">最初期のボス、それなりに強い</p>
                                    <p class="card-text"><small class="text-muted">敵</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/JOJO （１）.jpeg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">ジョナサン・ジョースター</h5>
                                    <p class="card-text">最強の主人公</p>
                                    <p class="card-text"><small class="text-muted">仲間</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/スピードワゴン.jpeg
                                " alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">スピードワゴン</h5>
                                    <p class="card-text">オウガーストリートというギャングの集まる道のボス。中盤からジョナサン達に協力する</p>
                                    <p class="card-text"><small class="text-muted">仲間</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12  col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/ツッペリ.jpeg
                            " alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">ツッペリ男爵</h5>
                                    <p class="card-text">ジョナサンの波紋の師匠、これから先何代にも渡ってジョースター家をサポートする</p>
                                    <p class="card-text"><small class="text-muted">仲間</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/ストレイツォ.jpeg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">ストレイツォ</h5>
                                    <p class="card-text">最初は味方だが二部になると石仮面の力により敵になる</p>
                                    <p class="card-text"><small class="text-muted">味方？</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="my-footer">
        <div class="container">
            <div class="row footer-row">
                <div class="col-6" style="display: flex; align-items:center; justify-content: center;">
                    <div>
                        <a href="#">
                            <img src="./images/logo.svg" alt="" height="48">
                        </a>
                    </div>
                </div>
                <div class="col-6" style="display: flex; align-items:center; justify-content: center;">
                    <u><a class="privacy-policy-link">プライバシーポリシー</a></u>
                </div>
            </div>
        </div>
    </footer>
    <!-- <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script> -->
    <script src="./libs/bootstrap.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./libs/bootstrap.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <title>BeEngineer 説明・体験会</title>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar navbar-light">
                <a class="navbar-brand" href="#">
                    <img class="logo" src="images/logo.svg" alt="" height="24">
                </a>
                <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <a class="nav-link" href="#TOP">TOP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#CONTENT">CONTENT</a>
                    </li>
                    <li class="nav-item">
                        <button id="alert-btn" type="button" class="btn btn-primary">ALERT</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="top-section" id="TOP">
        <div class="top-content">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h1>剣道のススメ
                        </h1>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="content-section" id="CONTENT">
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="https://kendopark.jp/kenjoy/wp-content/uploads/2019/07/kanoya-min-1024x576.jpg"" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">技の種類</h5>
                                    <p class="card-text">小手・面・胴</p>
                                    <p class="card-text"><small class="text-muted">高校生からはつきがある</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/logo.svg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">ルール</h5>
                                    <p class="card-text">3本勝負（5分間）
                                    </p>
                                    <p class="card-text"><small class="text-muted">引き分けの場合は延長される</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/logo.svg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">防具</h5>
                                    <p class="card-text">面・小手・胴・たれ</p>
                                    <p class="card-text"><small class="text-muted">竹刀と木刀</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12  col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/logo.svg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">段位</h5>
                                    <p class="card-text">段位は、技術的力量（精神的要素含む）を示す指標で、初段から八段（現在）まである</p>
                                    <p class="card-text"><small class="text-muted"></small>八段は合格率1%以下の最難関</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-12 col-sm-12">
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4"
                                style="display: flex; align-items:center; justify-content: center; padding:0.5rem;">
                                <img src="./images/logo.svg" alt="" width="80%">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">タイトルテキスト</h5>
                                    <p class="card-text">テキストテキストテキストテキストテキストテキストテキストテキストテキスト</p>
                                    <p class="card-text"><small class="text-muted">テキストテキストテキスト</small></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="my-footer">
        <div class="container">
            <div class="row footer-row">
                <div class="col-6" style="display: flex; align-items:center; justify-content: center;">
                    <div>
                        <a href="#">
                            <img src="./images/logo.svg" alt="" height="48">
                        </a>
                    </div>
                </div>
                <div class="col-6" style="display: flex; align-items:center; justify-content: center;">
                    <u><a class="privacy-policy-link">プライバシーポリシー</a></u>
                </div>
            </div>
        </div>
    </footer>
    <!-- <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script> -->
    <script src="./libs/bootstrap.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
